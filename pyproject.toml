[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grbl-machine-controller"
dynamic = ["version"]
description = "GRBL CNC controller appliance with Home Assistant MQTT integration"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "pyserial>=3.5",
    "paho-mqtt>=1.6,<2",
    "PySide6>=6.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff"]

[project.scripts]
grbl-machine-controller = "app.main:main"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
